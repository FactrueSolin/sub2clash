mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
unified-delay: true
external-controller: '127.0.0.1:9090'
tcp-concurrent: true
ipv6: true
dns:
    enable: true
    listen: '0.0.0.0:1053'
    ipv6: false
    default-nameserver: [119.29.29.29, 8.8.8.8, 1.1.1.1]
    nameserver: ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    proxy-server-nameserver: ['https://1.12.12.12/dns-query#DIRECT', 'https://223.5.5.5:443/dns-query#DIRECT', '1.1.1.1#SELECT']
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter: ['*.lan', '*.localdomain', '*.example', '*.invalid', '*.localhost', '*.test', '*.local', '*.home.arpa', 'time.*.com', 'time.*.gov', 'time.*.edu.cn', 'time.*.apple.com', 'time1.*.com', 'time2.*.com', 'time3.*.com', 'time4.*.com', 'time5.*.com', 'time6.*.com', 'time7.*.com', 'ntp.*.com', 'ntp1.*.com', 'ntp2.*.com', 'ntp3.*.com', 'ntp4.*.com', 'ntp5.*.com', 'ntp6.*.com', 'ntp7.*.com', '*.time.edu.cn', '*.ntp.org.cn', +.pool.ntp.org, time1.cloud.tencent.com, 'stun.*.*', 'stun.*.*.*', swscan.apple.com, mesu.apple.com, music.163.com, '*.music.163.com', '*.126.net', musicapi.taihe.com, music.taihe.com, songsearch.kugou.com, trackercdn.kugou.com, '*.kuwo.cn', api-jooxtt.sanook.com, api.joox.com, y.qq.com, '*.y.qq.com', streamoc.music.tc.qq.com, mobileoc.music.tc.qq.com, isure.stream.qqmusic.qq.com, dl.stream.qqmusic.qq.com, aqqmusic.tc.qq.com, amobile.music.tc.qq.com, localhost.ptlogin2.qq.com, '*.msftconnecttest.com', '*.msftncsi.com', '*.xiami.com', '*.music.migu.cn', music.migu.cn, +.wotgame.cn, +.wggames.cn, +.wowsgame.cn, +.wargaming.net, '*.*.*.srv.nintendo.net', '*.*.stun.playstation.net', 'xbox.*.*.microsoft.com', '*.*.xboxlive.com', '*.ipv6.microsoft.com', 'teredo.*.*.*', 'teredo.*.*', speedtest.cros.wr.pvp.net, +.jjvip8.com, www.douyu.com, activityapi.huya.com, activityapi.huya.com.w.cdngslb.com, www.bilibili.com, api.bilibili.com, a.w.bilicdn1.com]
    use-hosts: true
clash-for-android:
    append-system-dns: false
proxies:
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 手动切换
      - 自建节点
      - <countries>
      - DIRECT
  - name: 手动切换
    type: select
    proxies:
      - <all>
  - name: 自动选择
    type: url-test
    proxies:
      - <countries>
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 自建节点
    type: select
    proxies:
      - hqe-HK
      - factrue-SG
  - name: 游戏平台（中国）
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - <countries>
      - 手动切换
  - name: 游戏平台（全球）
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - <countries>
      - 手动切换
  - name: 巴哈姆特
    type: select
    proxies:
      - 节点选择
      - <countries>
      - 手动切换
      - DIRECT
  - name: 哔哩哔哩
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - <countries>
      - 手动切换
  - name: Telegram
    type: select
    proxies:
      - 节点选择
      - <countries>
      - 手动切换
      - DIRECT
  - name: OpenAI
    type: select
    proxies:
      - 节点选择
      - <countries>
      - 手动切换
      - DIRECT
  - name: Youtube
    type: select
    proxies:
      - 节点选择
      - <countries>
      - 手动切换
      - DIRECT
  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - <countries>
      - 手动切换
  - name: Onedrive
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - <countries>
      - 手动切换
  - name: Apple
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - <countries>
      - 手动切换
  - name: Netflix
    type: select
    proxies:
      - 节点选择
      - <countries>
      - 手动切换
      - DIRECT
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 漏网之鱼
    type: select
    proxies:
      - 节点选择
      - <countries>
      - 手动切换
      - DIRECT
rules:
  - GEOSITE,private,DIRECT,no-resolve
  - GEOIP,private,DIRECT
  - GEOSITE,category-ads-all,广告拦截
  - GEOSITE,microsoft,Microsoft
  - GEOSITE,apple,Apple
  - GEOSITE,netflix,Netflix
  - GEOIP,netflix,Netflix
  - GEOSITE,onedrive,Onedrive
  - GEOSITE,youtube,Youtube
  - GEOSITE,telegram,Telegram
  - GEOIP,telegram,Telegram
  - GEOSITE,openai,OpenAI
  - GEOSITE,bilibili,哔哩哔哩
  - GEOSITE,bahamut,巴哈姆特
  - GEOSITE,category-games@cn,游戏平台（中国）
  - GEOSITE,category-games,游戏平台（全球）
  - GEOSITE,geolocation-!cn,节点选择
